<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness.app</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="images/0logo.png">
</head>
<body>
    <div class="workout-header">
        <h1>Workout</h1>
        <a id="endWorkoutBtn" class="btn btn-end" href="index.html">Finish</a>

    </div>

    <h1 id="stopwatchDisplay">Duration 00:00</h1>

    <main>
        <section>
            <form id="exerciseForm">
                <p>
                    <a class="btn btn-new" href="inmainexercise.html">+ Add Exercise ‎‎‎‎‎ </a>
                </p>
            </form>
            <div id="exerciseResults" class="results-container"></div>
        </section>

        <section>
            <p>
                <input type="number" id="setsInput" required placeholder="Set" min="1" max="99">
                <input type="number" id="repsInput" required placeholder="Reps" min="1" max="99">
                <input type="number" id="weightInput" required placeholder="Weight" min="0" max="600">
            </p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
